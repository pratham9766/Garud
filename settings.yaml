board:
  pin_numbering: BCM
  i2c_sda_gpio: 2
  i2c_scl_gpio: 3
  spi0_mosi_gpio: 10
  spi0_miso_gpio: 9
  spi0_sclk_gpio: 11

camera:
  resolution: [1920, 1080]
  preview: true
  image_dir: captures/images
  video_dir: captures/videos
  video_seconds: 10
  continuous_interval_seconds: 2.0

servo:
  gpio: 4
  min_pulse: 500
  max_pulse: 2500
  min_angle: 0
  max_angle: 180
  settle_seconds: 0.5

bno055:
  interface: i2c
  address: 0x28
  sda_gpio: 2
  scl_gpio: 3
  schematic_reset_gpio: 5
  schematic_cs_gpio: 8
  schematic_int_gpio: 27
  refresh_hz: 10

bmp388:
  interface: spi
  address: 0x76
  sck_gpio: 11
  mosi_gpio: 10
  miso_gpio: 9
  cs_gpio: 22
  int_gpio: 27
  sea_level_pressure_hpa: 1013.25
  refresh_hz: 5

logging:
  save_logs: true
  level: INFO
  directory: logs
